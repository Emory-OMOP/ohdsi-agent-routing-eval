[project]
name = "circe-compiler"
version = "0.1.0"
description = "OHDSI CIRCE cohort definition compiler — JSON to optimized SQL via SQLGlot, exposed as MCP tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "sqlglot>=26.0.0",
    "pydantic>=2.0",
    "mcp>=1.0.0",
    "fastmcp>=2.0.0",
    "duckdb>=1.1.0",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circe_compiler"]
